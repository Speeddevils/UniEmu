<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12082b"/><stop offset="0.58" stop-color="#2b0b52"/><stop offset="1" stop-color="#0d0620"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe14d"/><stop offset="0.55" stop-color="#ff7a3d"/><stop offset="1" stop-color="#ff2e88"/>
    </linearGradient>
    <linearGradient id="u" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ff6ff"/><stop offset="0.5" stop-color="#00c8ff"/><stop offset="1" stop-color="#8a5cff"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a0a4a"/><stop offset="1" stop-color="#0a0418"/>
    </linearGradient>
    <clipPath id="tile"><rect x="20" y="20" width="472" height="472" rx="108"/></clipPath>
    <clipPath id="sunclip">
      <rect x="0" y="0" width="512" height="236"/>
      <rect x="0" y="244" width="512" height="14"/>
      <rect x="0" y="266" width="512" height="11"/>
      <rect x="0" y="285" width="512" height="8"/>
      <rect x="0" y="300" width="512" height="5"/>
    </clipPath>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <!-- estrelas -->
    <g fill="#ffffff" opacity="0.7">
      <circle cx="70" cy="80" r="2.5"/><circle cx="120" cy="150" r="1.8"/><circle cx="430" cy="95" r="2.5"/>
      <circle cx="395" cy="160" r="1.6"/><circle cx="455" cy="200" r="1.8"/><circle cx="60" cy="210" r="1.6"/>
    </g>
    <!-- sol -->
    <circle cx="256" cy="232" r="150" fill="url(#sun)" clip-path="url(#sunclip)"/>
    <!-- chão com grade -->
    <rect x="0" y="312" width="512" height="200" fill="url(#floor)"/>
    <g stroke="#ff2e88" stroke-width="3" opacity="0.9" fill="none">
      <line x1="0" y1="312" x2="512" y2="312" stroke-width="4"/>
      <line x1="0" y1="326" x2="512" y2="326"/>
      <line x1="0" y1="346" x2="512" y2="346"/>
      <line x1="0" y1="374" x2="512" y2="374"/>
      <line x1="0" y1="412" x2="512" y2="412"/>
      <line x1="0" y1="462" x2="512" y2="462"/>
      <line x1="256" y1="312" x2="256" y2="512"/>
      <line x1="216" y1="312" x2="136" y2="512"/><line x1="296" y1="312" x2="376" y2="512"/>
      <line x1="176" y1="312" x2="16" y2="512"/><line x1="336" y1="312" x2="496" y2="512"/>
      <line x1="136" y1="312" x2="-104" y2="512"/><line x1="376" y1="312" x2="616" y2="512"/>
      <line x1="96" y1="312" x2="-224" y2="512"/><line x1="416" y1="312" x2="736" y2="512"/>
    </g>
    <rect x="0" y="300" width="512" height="24" fill="#ff2e88" opacity="0.35" filter="url(#soft)"/>
    <!-- U -->
    <path d="M168 118 V292 a88 88 0 0 0 176 0 V118" fill="none" stroke="#0b0420" stroke-width="96" stroke-linecap="round" opacity="0.85"/>
    <g filter="url(#glow)">
      <path d="M168 118 V292 a88 88 0 0 0 176 0 V118" fill="none" stroke="url(#u)" stroke-width="70" stroke-linecap="round"/>
    </g>
    <path d="M150 118 V290" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.55"/>
    <!-- botões do controle nos topos do U -->
    <circle cx="168" cy="118" r="13" fill="#ff2e88"/>
    <circle cx="344" cy="118" r="13" fill="#ffe14d"/>
  </g>
  <rect x="20" y="20" width="472" height="472" rx="108" fill="none" stroke="#ff2e88" stroke-width="6" opacity="0.8"/>
</svg>
